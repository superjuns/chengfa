<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>乘法预热：一共有几个呢？</title>
    <style>
        :root {
            --primary: #4FC3F7;
            --success: #81C784;
            --error: #E57373;
            --warn: #FFD54F;
            --bg: #F8FAFC;
            --key-bg: #F1F5F9;
            --key-bg-active: #E2E8F0;
            --del-bg: #FFEBEE;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 20px; background: var(--bg);
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            display: flex; justify-content: center; min-height: 100vh;
        }
        .app {
            background: white; border-radius: 40px; padding: 30px 20px;
            max-width: 600px; width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); text-align: center;
            display: flex; flex-direction: column;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            position: relative;
        }
        h1 { color: var(--primary); font-size: 20px; margin-top: 0; margin-bottom: 8px; }
        .header-row {
            display: flex; justify-content: center; align-items: center;
            gap: 12px; margin-bottom: 10px; flex-wrap: wrap;
        }
        .progress { color: #94A3B8; font-size: 13px; }
        .exam-status-bar {
            display: none; justify-content: space-between; align-items: center;
            background: #FFF3E0; padding: 8px 15px; border-radius: 20px;
            margin-bottom: 15px; border: 1px solid #FFCC80;
        }
        .exam-status-bar.active { display: flex; flex-wrap: wrap; gap: 5px; }
        .timer-box { color: #E65100; font-weight: bold; font-size: 18px; }
        .score-box { color: #2E7D32; font-weight: bold; font-size: 18px; }
        .visual-area {
            background: #F1F5F9; border-radius: 24px; padding: 10px;
            margin-bottom: 10px; height: 200px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 8px; position: relative;
            overflow: hidden; flex-shrink: 0;
        }
        .visual-content {
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 8px;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }
        .array-row { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: nowrap; }
        .group-box {
            background: #E3F2FD; padding: 10px; border-radius: 16px;
            display: flex; flex-wrap: nowrap; justify-content: center; align-items: center; gap: 6px;
            box-shadow: inset 0 0 0 2px #90CAF9;
        }
        .pair-box { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .pair-item { display: flex; gap: 4px; padding: 3px; align-items: center; border-bottom: 2px dashed #90A4AE; }
        .emoji-icon { font-size: 50px; line-height: 1; display: inline-block; flex-shrink: 0; }
        .question-hint {
            font-size: 20px; color: #F57F17; background: #FFF8E1;
            padding: 4px 14px; border-radius: 30px; border: 1px dashed #FFD54F;
            display: inline-block; margin-top: 0; margin-bottom: 6px;
        }
        .btn-hint {
            background: var(--warn); border: none; border-radius: 30px;
            padding: 6px 16px; font-size: 14px; color: #4A3A00; 
            cursor: pointer; box-shadow: 0 2px 0 #F9A825; margin: 4px auto 8px auto;
            display: inline-block;
        }
        .btn-hint:active { transform: translateY(2px); box-shadow: 0 0 0 #F9A825; }
        .input-area { 
            display: flex; justify-content: center; align-items: center; 
            gap: 10px; flex-wrap: wrap; margin-bottom: 8px; 
        }
        .input-area input {
            width: 110px; padding: 12px; font-size: 24px; text-align: center;
            border: 3px solid #E2E8F0; border-radius: 16px; outline: none; font-weight: bold; color: #475569;
            background: #F8FAFC;
        }
        .btn-check {
            background: var(--primary); color: white; border: none;
            padding: 12px 25px; font-size: 20px; border-radius: 40px; cursor: pointer;
            box-shadow: 0 4px 0 #0288D1; transition: 0.1s;
        }
        .btn-check:active { transform: translateY(4px); box-shadow: 0 0 0 #0288D1; }
        .btn-next {
            background: #FFF; border: 2px solid #CBD5E1; border-radius: 40px;
            padding: 12px 25px; font-size: 20px; color: #475569; cursor: pointer;
            box-shadow: 0 4px 0 #94A3B8; transition: 0.1s;
        }
        .btn-next:active { transform: translateY(4px); box-shadow: 0 0 0 #94A3B8; }
        .feedback { min-height: 40px; margin-bottom: 10px; font-size: 17px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .feedback .ok { color: #2E7D32; font-weight: bold; }
        .feedback .no { color: #C62828; font-weight: bold; }
        .feedback .tip { color: #F57F17; }
        .numpad-grid {
            display: grid; grid-template-columns: repeat(6, 1fr);
            gap: 8px; max-width: 320px; margin: 5px auto 0 auto; width: 100%;
        }
        .numpad-key {
            background: var(--key-bg); border: none; aspect-ratio: 1 / 1;
            border-radius: 50%; font-size: 22px; font-weight: bold;
            color: #334155; cursor: pointer; box-shadow: 0 3px 0 #CBD5E1;
            transition: all 0.05s linear; user-select: none;
            display: flex; justify-content: center; align-items: center;
        }
        .numpad-key:active { transform: translateY(3px); box-shadow: 0 0 0 #CBD5E1; background: var(--key-bg-active); }
        .numpad-key.del { background: var(--del-bg); color: #D32F2F; font-size: 20px; box-shadow: 0 3px 0 #EF9A9A; }
        .numpad-key.del:active { background: #FFCDD2; }
        .btn-exam {
            background: #9575CD; color: white; border: none;
            padding: 10px 25px; font-size: 18px; border-radius: 40px; cursor: pointer;
            box-shadow: 0 4px 0 #512DA8; transition: 0.1s;
        }
        .btn-exam:active { transform: translateY(4px); box-shadow: 0 0 0 #512DA8; }
        .btn-exam.cancel { background: #90A4AE; box-shadow: 0 4px 0 #607D8B; }
        
        /* 新增实时排名样式 */
        .rank-status-box {
            display: none; margin: 10px 0 15px 0; padding: 8px 15px;
            background: #E8F5E9; border-radius: 30px;
            border: 1px solid #A5D6A7; color: #2E7D32; font-weight: bold;
            font-size: 18px; justify-content: center; align-items: center; gap: 5px;
        }
        .rank-status-box.active { display: flex; }
        .rank-status-box .rank-num { font-size: 22px; }

        .leaderboard-area {
            margin-top: 10px; padding-top: 10px; border-top: 2px dashed #E2E8F0;
        }
        .leaderboard-area h3 { color: #3E2723; margin: 0 0 6px 0; font-size: 16px; }
        .lb-list {
            list-style: none; padding: 0; margin: 0; text-align: left;
            max-height: 120px; overflow-y: auto;
        }
        .lb-list li {
            background: #F1F5F9; padding: 4px 12px; margin-bottom: 3px;
            border-radius: 20px; display: flex; justify-content: space-between;
            font-size: 13px; align-items: center;
        }
        .lb-list li:nth-child(1) { background: #FFECB3; border: 1px solid #FFD54F; }
        .lb-list li:nth-child(2) { background: #E0E0E0; border: 1px solid #BDBDBD; }
        .lb-list li:nth-child(3) { background: #FFCCBC; border: 1px solid #FFAB91; }
        .rank-badge { font-weight: bold; color: #795548; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; align-items: center;
            justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white; border-radius: 40px; padding: 30px;
            max-width: 400px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 0; margin-bottom: 20px;
        }
        .modal-header h2 { margin: 0; color: #9575CD; font-size: 22px; }
        .modal-close {
            cursor: pointer; font-size: 26px; color: #90A4AE;
            line-height: 1; padding: 5px 10px; border-radius: 50%;
            transition: all 0.2s; font-family: sans-serif;
            position: absolute; top: 15px; right: 20px;
        }
        .modal-close:hover, .modal-close:active { background: #F1F5F9; color: #475569; }
        .modal-box label { display: block; text-align: left; margin: 10px 0 5px; font-weight: bold; }
        .modal-box select, .modal-box input {
            width: 100%; padding: 12px; font-size: 18px; border: 2px solid #E2E8F0;
            border-radius: 16px; outline: none; margin-bottom: 15px;
        }
        .modal-box button {
            width: 100%; padding: 15px; font-size: 20px; border: none;
            border-radius: 40px; background: #9575CD; color: white; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 0 #512DA8; transition: 0.1s;
        }
        .modal-box button:active { transform: translateY(4px); box-shadow: 0 0 0 #512DA8; }
        .modal-box button:disabled { opacity: 0.6; transform: translateY(4px); box-shadow: 0 0 0 #512DA8; cursor: not-allowed; }
        .modal-msg { color: #E53935; font-size: 14px; margin-top: -10px; margin-bottom: 10px; display: none; }

        @media (max-width: 480px) {
            .app { padding: 20px 15px; } .emoji-icon { font-size: 45px; }
            h1 { font-size: 20px; } .question-hint { font-size: 20px; padding: 4px 14px; }
            .input-area input { width: 90px; font-size: 20px; }
            .btn-check, .btn-next { padding: 10px 18px; font-size: 17px; }
            .numpad-grid { gap: 8px; max-width: 280px; }
            .numpad-key { font-size: 24px; }
            .numpad-key.del { font-size: 18px; }
            .rank-status-box { font-size: 16px; padding: 6px 12px; }
        }

        /* 一起数学 · 系列统一身份信息弹窗 */
        .modal-overlay.yiqi-identity-overlay { padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom)); background:rgba(0,0,0,.30); backdrop-filter:blur(8px) saturate(120%); -webkit-backdrop-filter:blur(8px) saturate(120%); }
        .modal-box.yiqi-identity-card { width:min(100%,420px); max-width:420px; max-height:calc(100svh - 36px); overflow-y:auto; padding:28px 28px 24px; border:1px solid rgba(0,0,0,.06); border-radius:24px; background:rgba(255,255,255,.98); box-shadow:0 24px 70px rgba(0,0,0,.22); color:#1d1d1f; text-align:left; }
        .yiqi-identity-header { margin-bottom:22px; text-align:center; }
        .modal-header .yiqi-identity-title { margin:0; color:#1d1d1f; font-size:28px; line-height:1.15; letter-spacing:-.02em; }
        .yiqi-identity-description { margin:10px 0 0; color:#6e6e73; font-size:14px; line-height:1.55; }
        .modal-box .yiqi-identity-field { display:block; margin:16px 0 0; color:#1d1d1f; font-size:15px; font-weight:600; }
        .modal-box .yiqi-identity-field select,.modal-box .yiqi-identity-field input { width:100%; height:50px; margin:8px 0 0; padding:0 14px; border:1px solid #d2d2d7; border-radius:14px; outline:none; background:#fff; color:#1d1d1f; font:inherit; font-weight:400; transition:border-color 160ms ease,box-shadow 160ms ease; }
        .modal-box .yiqi-identity-field select:focus,.modal-box .yiqi-identity-field input:focus { border-color:#007aff; box-shadow:0 0 0 4px rgba(0,122,255,.12); }
        .modal-box .yiqi-identity-primary,.modal-box .yiqi-identity-secondary { width:100%; min-height:50px; padding:0 16px; border:0; border-radius:14px; box-shadow:none; cursor:pointer; }
        .modal-box .yiqi-identity-primary { margin-top:22px; background:#007aff; color:#fff; font-size:17px; font-weight:700; box-shadow:0 8px 20px rgba(0,122,255,.18); }
        .modal-box .yiqi-identity-secondary { margin-top:8px; background:transparent; color:#6e6e73; font-size:15px; font-weight:500; }
        .modal-box .yiqi-identity-primary:active,.modal-box .yiqi-identity-secondary:active { transform:scale(.97); box-shadow:none; transition:transform 100ms ease-out; }
        .modal-box .yiqi-identity-primary:disabled { opacity:.55; transform:none; box-shadow:none; }
        .modal-msg.yiqi-identity-error { margin:12px 0 0; padding:10px 12px; border-radius:12px; background:#fff1f0; color:#c9342a; font-size:13px; line-height:1.45; }
        @media(max-width:480px){.modal-box.yiqi-identity-card{padding:24px 20px 18px;border-radius:22px}.modal-header .yiqi-identity-title{font-size:25px}}
        @media(prefers-reduced-motion:reduce){.modal-box .yiqi-identity-primary,.modal-box .yiqi-identity-secondary{transition:none}}
        /* 系列化 + 个性化：乘法预热 */

        body[data-yiqi-game="multiplication"] .app { width:min(100%,760px); max-width:760px; margin:0 auto; padding:22px; border:0; border-radius:28px; background:#fff; box-shadow:0 10px 32px rgba(0,0,0,.06); }
        body[data-yiqi-game="multiplication"] .game-header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:10px; text-align:left; }
        body[data-yiqi-game="multiplication"] .game-kicker { margin:0 0 5px; color:var(--yiqi-accent); font-size:12px; line-height:1; font-weight:750; letter-spacing:.13em; }
        body[data-yiqi-game="multiplication"] h1 { margin:0; color:#1d1d1f; font-size:clamp(28px,6vw,38px); line-height:1.08; letter-spacing:-.035em; }
        body[data-yiqi-game="multiplication"] .practice-status { display:flex; align-items:center; min-height:38px; margin-bottom:10px; padding:0 12px; border-radius:13px; background:#f5f5f7; text-align:left; }
        body[data-yiqi-game="multiplication"] .progress { color:#6e6e73; font-size:13px; font-weight:600; }
        body[data-yiqi-game="multiplication"] .btn-exam { min-height:46px; padding:0 18px; border:1px solid #007aff; border-radius:14px; background:#007aff; color:#fff; box-shadow:0 6px 16px rgba(0,122,255,.16); font-size:16px; font-weight:700; transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 160ms ease; }
        body[data-yiqi-game="multiplication"] .btn-exam:active,body[data-yiqi-game="multiplication"] .btn-hint:active,body[data-yiqi-game="multiplication"] .btn-check:active,body[data-yiqi-game="multiplication"] .btn-next:active,body[data-yiqi-game="multiplication"] .numpad-key:active { transform:scale(.97); }

        body[data-yiqi-game="multiplication"] .btn-check { border:1px solid #dec3eb; background:#fff; color:#1d1d1f; }
        body[data-yiqi-game="multiplication"] .btn-next { border:1px solid transparent; background:#f2f2f7; color:#1d1d1f; }

<body data-yiqi-game="multiplication">
<div class="app" data-yiqi-core-flow>
    <header class="game-header">
        <div><p class="game-kicker">GROUP &amp; MULTIPLY</p><h1>乘法预热</h1></div>
        <button class="btn-exam" id="btnExamMode" data-yiqi-action="answer" onclick="openExamModal()">答题模式</button>
    </header>
    <div class="practice-status"><span class="progress" id="progressText">观察图形，想一想一共有几个</span></div>
    <div class="exam-status-bar" id="examStatusBar">
        <span class="timer-box">⏳ 剩余: <span id="timerDisplay">60</span>s</span>
        <span class="score-box">✅ 答对: <span id="scoreDisplay">0</span></span>
    </div>
    
    <!-- 新增实时排名通知框 -->
    <div class="rank-status-box" id="rankStatusBox">
        🏁 当前排名：<span class="rank-num" id="currentRankNum">--</span>
    </div>

    <div class="visual-area" id="visualArea"></div>
    <div class="question-hint" id="hintText">口诀：五六？</div>
    <button class="btn-hint" data-yiqi-action="secondary" onclick="showHint()">小提示</button>

    const emojiPool = ['🍎', '🍊', '🍋', '🍇', '🍉', '🍓', '🍑', '🥝', '🍌', '🍩', '🧁', '🍭', '🐱', '🐶', '🐰', '🐻', '🦊', '🐼'];

    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function numToChinese(num) { const map = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九']; return map[num] || num; }

    function generateQuestion() {
        if (isExamMode && isExamFinished) return;
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
        isWaiting = false;
        const emoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
        const layout = layoutTypes[Math.floor(Math.random() * layoutTypes.length)];
        let rows = getRandomInt(2, 9); let cols = getRandomInt(2, 9);
        while (rows * cols > 81) { cols = getRandomInt(2, 9); rows = getRandomInt(2, 9); }
        if (layout === 'pair') cols = 2; 
        const total = rows * cols;
        const small = Math.min(rows, cols);
        const large = Math.max(rows, cols);
        const hintStr = `${numToChinese(small)}${numToChinese(large)}？`;
        currentQuestion = { emoji, layout, rows, cols, total, hint: hintStr, small, large };
        renderVisual();

        document.getElementById('feedback').innerHTML = `<span class="tip">🤔 边数边思考，填上口诀里的数字吧！</span>`;

    function renderVisual() {
        const area = document.getElementById('visualArea');
        area.innerHTML = '';
        const { emoji, layout, rows, cols } = currentQuestion;

        // 用 content 包裹所有元素，便于整体缩放
        const content = document.createElement('div');
        content.className = 'visual-content';
        content.id = 'visualContent';

        if (layout === 'row') {
            for (let i = 0; i < rows; i++) {
                const rowDiv = document.createElement('div'); rowDiv.className = 'array-row';
                for (let j = 0; j < cols; j++) {
                    const span = document.createElement('span'); span.className = 'emoji-icon'; span.innerText = emoji;
                    rowDiv.appendChild(span);
                }
                content.appendChild(rowDiv);
            }
        } else if (layout === 'group') {
            for (let i = 0; i < rows; i++) {
                const groupDiv = document.createElement('div'); groupDiv.className = 'group-box';
                for (let j = 0; j < cols; j++) {
                    const span = document.createElement('span'); span.className = 'emoji-icon'; span.innerText = emoji;
                    groupDiv.appendChild(span);
                }
                content.appendChild(groupDiv);
            }
        } else if (layout === 'pair') {
            const pairDiv = document.createElement('div'); pairDiv.className = 'pair-box';
            for (let i = 0; i < rows; i++) {
                const item = document.createElement('div'); item.className = 'pair-item';
                for (let j = 0; j < cols; j++) {
                    const span = document.createElement('span'); span.className = 'emoji-icon'; span.innerText = emoji;
                    item.appendChild(span);
                }
                pairDiv.appendChild(item);
            }
            content.appendChild(pairDiv);
        }

        area.appendChild(content);

        // 先用默认大小渲染，再整体缩放适配
        requestAnimationFrame(() => {
            fitVisualToBox();
        });
    }

    function fitVisualToBox() {
        const area = document.getElementById('visualArea');
        const content = document.getElementById('visualContent');
        if (!content) return;

        // 重置缩放
        content.style.transform = 'scale(1)';

        const boxW = area.clientWidth - 20;
        const boxH = area.clientHeight - 20;
        const contentW = content.offsetWidth;
        const contentH = content.offsetHeight;

        if (contentW <= boxW && contentH <= boxH) {
            return; // 已经装下，不用缩
        }

        const scaleX = boxW / contentW;
        const scaleY = boxH / contentH;
        const scale = Math.min(scaleX, scaleY);

        content.style.transform = `scale(${scale})`;
    }

    function checkAnswer() {
        if (isWaiting) return;
        if (isExamMode && isExamFinished) {
            document.getElementById('feedback').innerHTML = `<span class="no">⏰ 答题时间已到，请查看成绩！</span>`;
            return;
        }
        const val = document.getElementById('answerInput').value.trim();
        if (val === "") { document.getElementById('feedback').innerHTML = `<span class="no">请输入数字哦！</span>`; return; }
        const userAnswer = Number(val);
        const correct = currentQuestion.total;
        if (userAnswer === correct) {
            if (isExamMode) {
                correctCount++;
                document.getElementById('scoreDisplay').innerText = correctCount;
            }
            document.getElementById('feedback').innerHTML = `<span class="ok">🌟 完全正确！<b>口诀：${currentQuestion.hint}</b> 的答案就是 <b>${correct}</b>！${isExamMode ? '继续加油！' : '2秒后自动进入下一题...'}</span>`;
            isWaiting = true;
            autoTimer = setTimeout(() => {
                generateQuestion();
            }, isExamMode ? 1000 : 2000);
        } else {
            document.getElementById('feedback').innerHTML = `<span class="no">❌ 好像不对哦，再仔细观察一下排法，数仔细点~</span>`;
        }
    }

    function showHint() {
        const { layout, emoji, hint, small, large } = currentQuestion;
        let msg = "";
        if (layout === 'row') msg = `💡 这里有 <b>${large}</b> 排，每排有 <b>${small}</b> 个 ${emoji}。<b>口诀：${hint}</b> 等于多少呢？`;
        else if (layout === 'group') msg = `💡 这里有 <b>${large}</b> 个框框，每个框框里都有 <b>${small}</b> 个 ${emoji}。<b>口诀：${hint}</b> 等于多少呢？`;

    document.getElementById('numpad').addEventListener('click', function(e) {

        input.focus();
    });

    // 窗口大小变化时重新自适应图形
    let resizeTimer = null;
    window.addEventListener('resize', function() {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            if (currentQuestion && currentQuestion.emoji) {
                fitVisualToBox();
            }
        }, 100);
    });

    /* --- 答题模式逻辑 --- */
    // 工具函数
    function getUrlParam(name) {
        return new URLSearchParams(window.location.search).get(name) || '';
    }
    function normStr(s) {
        return String(s || '').replace(/班/g, '').replace(/\s/g, '').toLowerCase();
    }

    // URL参数自动登录（平台跳转时免输入）
    async function tryAutoLoginFromUrl() {
        const cls = getUrlParam('class') || getUrlParam('cls') || getUrlParam('班级');
        const name = getUrlParam('name') || getUrlParam('姓名');
        if (!cls || !name) return false;
        const normCls = /^\d+$/.test(cls) ? cls + '班' : cls;
        try {
            const resp = await fetch(API_WHITELIST);
            if (!resp.ok) return false;
            const data = await resp.json();
            const listData = extractArrayFromResponse(data);
            if (!Array.isArray(listData)) return false;
            const matched = listData.some(item => {
                if (typeof item === 'object' && item !== null) {
                    const ic = item.class || item['班级'] || item.className || '';
                    const iname = item.name || item['姓名'] || item.studentName || '';
                    return normStr(ic) === normStr(normCls) && normStr(iname) === normStr(name);
                }
                return false;
            });
            if (!matched) return false;
            localStorage.setItem('chengfa_class', normCls);
            localStorage.setItem('chengfa_name', name);
            return true;
        } catch (e) { return false; }
    }

    function openExamModal() {

        // 如果已有登录信息，直接开始答题

        document.getElementById('examModal').classList.remove('active');

    async function validateAndStartExam() {
        const classVal = document.getElementById('classSelect').value;
        const nameVal = document.getElementById('nameInput').value.trim();
        const modalMsg = document.getElementById('modalMsg');
        if (!classVal) { modalMsg.textContent = "请选择班级"; modalMsg.style.display = 'block'; return; }
        if (!nameVal) { modalMsg.textContent = "请输入姓名"; modalMsg.style.display = 'block'; document.getElementById('nameInput').focus(); return; }

        const btn = document.getElementById('startExamBtn');
        btn.disabled = true;
        btn.innerText = "正在验证白名单...";
        document.getElementById('modalMsg').style.display = 'none';

        try {
            console.log("正在请求白名单接口:", API_WHITELIST);
            const response = await fetch(API_WHITELIST, { mode: 'cors' });
            if (!response.ok) throw new Error(`服务器响应状态码: ${response.status}`);
            const data = await response.json();
            console.log("【白名单】原始返回数据类型:", typeof data);
            console.log("【白名单】原始返回内容:", data);

            let listData = extractArrayFromResponse(data);
            console.log("【白名单】最终提取的名单列表:", listData);

            let isAuthorized = false;
            let reason = "未知错误";

            if (Array.isArray(listData)) {
                if (listData.length === 0) reason = "白名单数据为空";
                else {
                    const targetCombined = `${classVal}-${nameVal}`;
                    const targetCombined2 = `${classVal} ${nameVal}`;
                    for (const item of listData) {
                        if (typeof item === 'string' && (item === targetCombined || item === targetCombined2)) {
                            isAuthorized = true; break;
                        } else if (typeof item === 'object' && item !== null) {
                            const c = item.class || item.Class || item.cls;
                            const n = item.name || item.Name || item.nick;
                            if (c && n) {
                                if (String(c).replace(/[-\s]/g, '') === String(classVal).replace(/[-\s]/g, '') &&
                                    String(n).replace(/[-\s]/g, '') === String(nameVal).replace(/[-\s]/g, '')) {
                                    isAuthorized = true; break;
                                }
                            }
                        }
                    }
                    if (!isAuthorized) reason = "姓名不在当前班级白名单中";
                }
            } else {
                reason = `无法提取到数组。${typeof listData === 'object' ? JSON.stringify(listData) : String(listData)}`;
            }

            if (!isAuthorized) {
                document.getElementById('modalMsg').style.display = 'block';
                console.warn("白名单验证失败原因:", reason);
                btn.disabled = false; btn.innerText = "开始答题";
                return;

            currentStudentClass = classVal; currentStudentName = nameVal;
            document.getElementById('examModal').classList.remove('active');

            const sdk = initYiqiGameSdk();
            if (sdk) sdk.setIdentity({ class: classVal, name: nameVal });
                        startExamMode();

        } catch (err) {
            console.error(err);
            alert("白名单连接失败: " + err.message);
            btn.disabled = false; btn.innerText = "开始答题";
        }
    }

    function extractArrayFromResponse(obj) {
        let foundArray = null;
        if (Array.isArray(obj)) return obj;
        if (obj && typeof obj === 'object') {
            const keys = ['data', 'list', 'rows', 'items', 'members', 'students', 'users', 'result', 'results', 'content'];
            for (const key of keys) {
                if (obj[key] && Array.isArray(obj[key])) return obj[key];
            }
            function findRecursively(currentObj) {
                if (foundArray) return;
                for (const key in currentObj) {
                    if (currentObj.hasOwnProperty(key)) {
                        const val = currentObj[key];
                        if (Array.isArray(val)) {
                            foundArray = val; return;
                        } else if (val && typeof val === 'object') {
                            findRecursively(val);
                        }
                    }
                }
            }
            findRecursively(obj);
            if (foundArray) return foundArray;
        }
        if (typeof obj === 'string' && obj.trim()) {
            if (obj.includes('\n')) return obj.split('\n').map(s => s.trim()).filter(s => s);
            if (obj.includes(',')) return obj.split(',').map(s => s.trim()).filter(s => s);
            if (obj.includes(';')) return obj.split(';').map(s => s.trim()).filter(s => s);
        }
        return null;
    }

    function startExamMode() {
        isExamMode = true; isExamFinished = false; examTimeLeft = 60; correctCount = 0;
        document.getElementById('examStatusBar').classList.add('active');
        document.getElementById('timerDisplay').innerText = examTimeLeft;
        document.getElementById('scoreDisplay').innerText = correctCount;

        document.getElementById('rankStatusBox').classList.remove('active');
        generateQuestion();
        if (examTimerInterval) clearInterval(examTimerInterval);
        examTimerInterval = setInterval(() => {
            examTimeLeft--;
            document.getElementById('timerDisplay').innerText = examTimeLeft;
            if (examTimeLeft <= 0) {
                clearInterval(examTimerInterval); examTimerInterval = null;
                isExamFinished = true;
                document.getElementById('feedback').innerHTML = `<span class="no">⏰ 时间到！正在提交您的成绩...</span>`;
                submitScore();
            }
        }, 1000);
    }

    function endExamMode(isManualCancel = false) {
        if (examTimerInterval) clearInterval(examTimerInterval);
        isExamMode = false; isExamFinished = true;
        document.getElementById('examStatusBar').classList.remove('active');
        document.getElementById('btnExamMode').innerText = "答题模式";
        document.getElementById('btnExamMode').classList.remove('cancel');

        else document.getElementById('feedback').innerHTML = `<span class="tip">已退出答题模式，切换回热身练习。</span>`;
        generateQuestion();
    }

    async function submitScore() {
        const submitData = { class: currentStudentClass, name: currentStudentName, score: correctCount, timestamp: new Date().toISOString(), submitted_at: new Date().toISOString() };
        try {
            const sdk = initYiqiGameSdk();
            let submitted = false;
            if (sdk) {
                await sdk.submitScore(submitData, { includeGameId: false });
                submitted = true;
            } else {
                const response = await fetch(API_POST_SCORE, {
                    method: 'POST', mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submitData)
                });
                submitted = response.ok;
            }
            if (submitted) {
                endExamMode(false); 
                // 提交成绩后立即获取最新排行榜，并触发实时排名反馈
                await fetchLeaderboard(true); 
            } 
            else { document.getElementById('feedback').innerHTML = `<span class="no">❌ 成绩上传失败，请检查网络！</span>`; endExamMode(true); }
        } catch (err) { document.getElementById('feedback').innerHTML = `<span class="no">❌ 连接服务器失败！</span>`; endExamMode(true); }
    }

    /* --- 排行榜及实时排名逻辑 --- */
    function getBeijingTodayStr() {
        var d = new Date();
        d.setTime(d.getTime() + 8 * 3600 * 1000);
        return d.toISOString().slice(0, 10);
    }

        async function fetchLeaderboard(triggerRankFeedback = false) {
        const listElement = document.getElementById('leaderboardList');
        listElement.innerHTML = '<li style="justify-content:center; color:#94A3B8;">⏳ 加载排行榜...</li>';
        // 如果还未进入答题，先隐藏排名框
        if (!triggerRankFeedback) {
            document.getElementById('rankStatusBox').classList.remove('active');
        }

        try {
            const sdk = initYiqiGameSdk();
            let data;
            if (sdk) data = await sdk.request(API_LEADERBOARD, { mode: 'cors' });
            else {
                const response = await fetch(API_LEADERBOARD, { mode: 'cors' });
                if (!response.ok) throw new Error(`HTTP状态码 ${response.status}`);
                data = await response.json();
            }
            console.log("【排行榜】原始返回数据类型:", typeof data);
            console.log("【排行榜】原始返回内容:", data);

            let listData = extractArrayFromResponse(data);
            console.log("【排行榜】提取后的列表:", listData);

            if (Array.isArray(listData)) {
                // 只保留当天的提交记录（北京时间）
                var todayStr = getBeijingTodayStr();
                listData = listData.filter(function(item) {
                    var dateStr = item.submitted_at || item.timestamp || item.createTime || '';
                    return String(dateStr).slice(0, 10) === todayStr;
                });

                // 去重：相同班级和姓名，只保留得分最高的一条记录
                const uniqueMap = new Map();
                listData.forEach(item => {
                    const c = item.class || item.Class || item.cls || '';
                    const n = item.name || item.Name || item.nick || '';
                    if (!c && !n) return;
                    const key = `${c}|${n}`;
                    const currentScore = Number(item.score || item.count || item.num || item.points || item.total || 0);
                    if (!uniqueMap.has(key)) {
                        uniqueMap.set(key, item);
                    } else {
                        const existingItem = uniqueMap.get(key);
                        const existingScore = Number(existingItem.score || existingItem.count || existingItem.num || existingItem.points || existingItem.total || 0);
                        if (currentScore > existingScore) {
                            uniqueMap.set(key, item);
                        }
                    }
                });
                listData = Array.from(uniqueMap.values());
                console.log("【排行榜】去重后的列表:", listData);

                // 按得分降序排列
                const sorted = listData.sort((a, b) => {
                    const aScore = Number(a.score || a.count || a.num || a.points || a.total || 0);
                    const bScore = Number(b.score || b.count || b.num || b.points || b.total || 0);
                    return bScore - aScore;
                });
                
                const topList = sorted.slice(0, 10);
                if (topList.length === 0) {
                    listElement.innerHTML = '<li style="justify-content:center; color:#94A3B8;">暂无数据，快来挑战吧！</li>';
                } else {
                    listElement.innerHTML = topList.map((item, index) => {
                        const rank = index + 1;
                        let medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                        const c = item.class || item.Class || item.cls || '未知班级';
                        const n = item.name || item.Name || item.nick || '未知姓名';
                        const s = Number(item.score || item.count || item.num || item.points || item.total || 0);
                        return `<li><span><span class="rank-badge">${medal}</span> ${n} (${c})</span> <span style="color:#2E7D32;font-weight:bold;">${s}题</span></li>`;
                    }).join('');
                }

                // 【新增逻辑】实时排名反馈
                if (triggerRankFeedback && currentStudentClass && currentStudentName) {
                    const rankBox = document.getElementById('rankStatusBox');
                    const rankNumDisplay = document.getElementById('currentRankNum');
                    
                    let userRank = -1;
                    for (let i = 0; i < sorted.length; i++) {
                        const item = sorted[i];
                        const c = item.class || item.Class || item.cls || '';
                        const n = item.name || item.Name || item.nick || '';
                        // 精确匹配当前考试的班级和姓名
                        if (c === currentStudentClass && n === currentStudentName) {
                            userRank = i + 1;
                            break;
                        }
                    }
                    
                    if (userRank !== -1) {
                        rankNumDisplay.innerText = userRank + ` (共${sorted.length}人)`;
                        rankBox.classList.add('active');
                    } else {
                        // 如果刚提交API还未更新榜单，提示“计算中...”
                        rankNumDisplay.innerText = '计算中...';
                        rankBox.classList.add('active');
                    }
                }

            } else {
                let errorMsg = '数据格式异常';
                if (typeof data === 'object') {
                    try { errorMsg = '原始数据: ' + JSON.stringify(data).substring(0, 80) + '...'; } catch(e) {}
                } else {
                    errorMsg = '原始数据: ' + String(data);
                }
                listElement.innerHTML = `<li style="justify-content:center; color:#E57373; font-size:13px; white-space:pre-wrap;">❌ ${errorMsg}</li>`;
            }
        } catch (err) {
            console.error(err);
            listElement.innerHTML = `<li style="justify-content:center; color:#E57373;">网络异常: ${err.message}</li>`;
        }
    }

    window.onload = function() {
        syncIdentityFromSdk();
        generateQuestion();
        fetchLeaderboard(false);
    };
    document.getElementById('examModal').addEventListener('click', (event) => {
        if (event.target === event.currentTarget) closeExamModal();
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeExamModal();
    });
    // URL参数自动登录（平台跳转时免输入）
    tryAutoLoginFromUrl();

</script>
</body>
</html>
